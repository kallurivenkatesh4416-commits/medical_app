name: med_emergency_mobile
description: Residential Emergency Health Response Platform — resident app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.0
  # Slice 14 — resident path on a real Android device.
  # Every plugin sits behind a seam (see lib/api_client.dart, lib/auth/,
  # lib/connectivity.dart, lib/emergency_api.dart, lib/records_repo.dart)
  # so widget tests inject in-memory fakes and never touch a platform
  # channel; flutter_test stays green with no MethodChannel mocks.
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
