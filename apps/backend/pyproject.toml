[project]
name = "med-emergency-backend"
version = "0.1.0"
description = "Residential Emergency Health Response Platform — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "cryptography>=43.0",
    "boto3>=1.34",
    # Slice 8: hospital handover PDF. xhtml2pdf is the pure-Python substitute
    # for WeasyPrint (docs/setup.md records the swap — WeasyPrint's GTK/Pango
    # runtime requirement is impractical for local Windows dev and adds a
    # native dep on CI; xhtml2pdf renders the §8 form-style layout from the
    # same Jinja2 template). pypdf is used in tests to assert §8 contents.
    "jinja2>=3.1",
    "xhtml2pdf>=0.2.16",
    "pypdf>=4.3",
    # Slice 6/8: live Twilio gateway (SMS / voice / WhatsApp) hits Twilio's
    # REST API. `requests` is also transitively pulled in by xhtml2pdf;
    # listing it explicitly so the live gateway has a guaranteed dep.
    "requests>=2.31",
    # Slice 16: live FCM HTTP v1 gateway. We use the official Google auth
    # library for service-account credentials and OAuth2 token refresh —
    # the emergency push path is patient-safety-critical and the credential
    # refresh edge cases (clock skew, 401-then-refresh, metadata server
    # fallback) are easier to trust on the library path than hand-rolled.
    "google-auth>=2.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern intentionally calls these in defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
