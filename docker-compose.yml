# Local dev stack (brief §4). Backend app + migrations land in commit 3.
# Copy .env.example -> .env before `docker compose up`.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-medapp}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medapp}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-medapp}
      S3_ENDPOINT_URL: http://localstack:4566
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3,kms
    ports:
      - "4566:4566"
    volumes:
      - ./.localstack:/var/lib/localstack

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

volumes:
  pgdata:
